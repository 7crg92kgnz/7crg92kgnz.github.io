<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg: #ffffff;
    --card-border: #e4e4e7;
    --text-primary: #18181b;
    --text-muted: #71717a;

    --incomplete-circle-bg: #f4f4f5;
    --incomplete-circle-text: #71717a;
    --complete-circle-bg: #18181b;
    --complete-circle-text: #ffffff;
    --today-ring-color: #18181b;

    --reset-border: #e4e4e7;
    --reset-bg: #ffffff;
    --reset-text: #18181b;

    --mark-bg: #18181b;
    --mark-text: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text-primary);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 16px;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    min-width: 0;
  }

  .header-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-title-row svg {
    width: 16px;
    height: 16px;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .header-title-row h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .week-count {
    font-size: 20px;
    font-weight: 300;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .card-content {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    padding: 0 12px 16px;
  }

  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }

  .day-label {
    font-size: 11px;
    color: var(--text-muted);
  }

  .day-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 34px;
    aspect-ratio: 1 / 1;
    border-radius: 9999px;
    border: none;
    padding: 0;
    font-size: clamp(10px, 3.2vw, 12px);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    background: var(--incomplete-circle-bg);
    color: var(--incomplete-circle-text);
  }

  .day-circle.complete {
    background: var(--complete-circle-bg);
    color: var(--complete-circle-text);
  }

  .day-circle.today {
    border: 2px solid var(--today-ring-color);
  }

  .card-footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 0 16px 16px;
  }

  .streak-row {
    display: flex;
    flex-direction: row;
    gap: 8px;
  }

  .streak-row .label {
    font-size: 13px;
    opacity: 0.6;
  }

  .streak-row .value {
    font-size: 13px;
    font-weight: 500;
  }

  .footer-buttons {
    display: flex;
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  button {
    font-family: inherit;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    height: 36px;
    padding: 0 16px;
    cursor: pointer;
    transition: opacity 0.15s ease;
    min-width: 0;
  }

  .btn:hover { opacity: 0.85; }

  .btn-reset {
    border: 2px solid var(--reset-border);
    background: var(--reset-bg);
    color: var(--reset-text);
  }

  .btn-complete {
    border: none;
    background: var(--mark-bg);
    color: var(--mark-text);
    flex: 1;
  }

  /* Medium containers: tighten up spacing a little */
  @media (max-width: 360px) {
    .card-header { padding: 12px; }
    .card-content { padding: 0 10px 12px; gap: 3px; }
    .card-footer { padding: 0 12px 12px; }
    .day-circle { max-width: 30px; }
    .header-title-row h3 { font-size: 14px; }
    .week-count { font-size: 18px; }
  }

  /* Very narrow containers: stack the footer buttons */
  @media (max-width: 260px) {
    body { padding: 10px; }
    .footer-buttons { flex-direction: column; align-items: stretch; }
    .btn-complete { order: -1; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="header-left">
      <div class="header-title-row">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="0">
          <path d="M12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16C14.2091 16 16 14.2091 16 12C16 11.4477 16.4477 11 17 11C17.5523 11 18 11.4477 18 12C18 15.3137 15.3137 18 12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C12.5523 6 13 6.44772 13 7C13 7.55228 12.5523 8 12 8Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path>
          <path d="M12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 11.3823 20.9379 10.78 20.82 10.1989C20.7101 9.65769 21.0598 9.12985 21.601 9.01999C22.1423 8.91012 22.6701 9.25982 22.78 9.80107C22.9244 10.5124 23 11.2479 23 12C23 18.0751 18.0751 23 12 23C5.92487 23 1 18.0751 1 12C1 5.92487 5.92487 1 12 1C12.7521 1 13.4876 1.07563 14.1989 1.22002C14.7402 1.32989 15.0899 1.85772 14.98 2.39897C14.8701 2.94022 14.3423 3.28992 13.8011 3.18005C13.22 3.06209 12.6177 3 12 3Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path>
          <path d="M20.1421 2.07773C19.9845 1.47361 19.4963 1.10271 18.9726 1.01905C18.4678 0.938419 17.9564 1.11764 17.5909 1.48308L16.4415 2.63246C15.1721 3.90187 15.0659 5.46618 15.4909 7.09504L11.2929 11.293C10.9024 11.6835 10.9024 12.3167 11.2929 12.7072C11.6834 13.0978 12.3166 13.0978 12.7071 12.7072L16.9051 8.50926C18.5339 8.93425 20.0983 8.82798 21.3677 7.55858L22.517 6.40919C22.8825 6.04375 23.0617 5.53232 22.9811 5.02757C22.8974 4.50383 22.5265 4.01562 21.9224 3.858L20.5105 3.48962L20.1421 2.07773Z" fill="currentColor"></path>
        </svg>
        <h3>Study Streak</h3>
      </div>
      <p style="margin:0; font-size:12px;"></p>
    </div>
    <span class="week-count" id="weekCount">0/7</span>
  </div>

  <div class="card-content" id="daysRow"></div>

  <div class="card-footer">
    <div class="streak-row">
      <span class="label">Streak:</span>
      <span class="value" id="streakValue">0</span>
    </div>
    <div class="footer-buttons">
      <button class="btn btn-reset" id="resetBtn">Reset</button>
      <button class="btn btn-complete" id="completeBtn">Complete Today</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'blocky-study-streak-completed';
  const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

  function toDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function loadCompleted() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveCompleted() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    } catch (e) {
      // Silently ignore — state just won't survive a refresh here.
    }
  }

  let completed = loadCompleted(); // { 'YYYY-MM-DD': true }

  function getWeekDates() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dayOfWeek = today.getDay(); // 0 = Sun
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(today);
    monday.setDate(today.getDate() + mondayOffset);

    const week = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      week.push(d);
    }
    return week;
  }

  function computeStreak() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let pointer = new Date(today);

    if (!completed[toDateStr(pointer)]) {
      pointer.setDate(pointer.getDate() - 1);
    }

    let streak = 0;
    while (completed[toDateStr(pointer)]) {
      streak++;
      pointer.setDate(pointer.getDate() - 1);
    }
    return streak;
  }

  function render() {
    const week = getWeekDates();
    const todayStr = toDateStr(new Date());
    const daysRow = document.getElementById('daysRow');
    daysRow.innerHTML = '';

    let weekCompletedCount = 0;

    week.forEach((date, i) => {
      const dateStr = toDateStr(date);
      const isComplete = !!completed[dateStr];
      const isToday = dateStr === todayStr;
      if (isComplete) weekCompletedCount++;

      const col = document.createElement('div');
      col.className = 'day-col';

      const label = document.createElement('span');
      label.className = 'day-label';
      label.textContent = dayLabels[i];

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-circle' + (isComplete ? ' complete' : '') + (isToday ? ' today' : '');
      btn.setAttribute('aria-label', `Mark complete for ${dateStr}`);
      btn.textContent = date.getDate();
      btn.addEventListener('click', () => {
        completed[dateStr] = !completed[dateStr];
        saveCompleted();
        render();
      });

      col.appendChild(label);
      col.appendChild(btn);
      daysRow.appendChild(col);
    });

    document.getElementById('weekCount').textContent = `${weekCompletedCount}/7`;
    document.getElementById('streakValue').textContent = computeStreak();
  }

  document.getElementById('completeBtn').addEventListener('click', () => {
    completed[toDateStr(new Date())] = true;
    saveCompleted();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    completed = {};
    saveCompleted();
    render();
  });

  render();
</script>

</body>
</html>
